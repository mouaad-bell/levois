name: Dependency Lock Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit refreshed graph
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): refresh dependency lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
