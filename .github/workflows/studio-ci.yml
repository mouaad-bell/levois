name: Studio CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Editorial canon validation
        run: npm run validate:editorial
      - name: Render evidence validation
        run: npm run validate:render
      - name: D1 import safety
        run: npm run test:evidence-import
      - name: Build
        run: npm run build
